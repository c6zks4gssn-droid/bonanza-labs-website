name: PR-gate

# Dezelfde controle als scripts/pr-gate.sh, maar automatisch.
# Doel: geen wijziging naar main zonder geslaagde types en build — of die nu van
# een mens, GPT of Hermes komt.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Afhankelijkheden
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Productiebuild
        run: pnpm build
